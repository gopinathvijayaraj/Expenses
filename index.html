<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Expenses">
<title>Expenses</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{background:#0a0a0a;color:#f0f0f0;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',sans-serif;min-height:100vh;padding-bottom:40px;}
.wrap{padding:18px 18px 0;max-width:480px;margin:0 auto;}
.hdr{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px;}
.hdr h1{font-size:20px;font-weight:700;color:#f0f0f0;}
.hdr-date{font-size:13px;color:#555;margin-top:2px;}
.hdr-right{text-align:right;}
.hdr-surplus{font-size:20px;font-weight:700;}
.hdr-surplus-lbl{font-size:11px;color:#555;margin-top:1px;}
.green{color:#22c55e;}
.red{color:#ef4444;}
.tabs{display:flex;background:#111;border:1px solid #1e1e1e;border-radius:12px;padding:3px;margin-bottom:16px;}
.tab{flex:1;text-align:center;padding:9px;font-size:13px;font-weight:600;border-radius:9px;cursor:pointer;color:#555;}
.tab.active{background:#f0f0f0;color:#000;}
.add-card{background:#111;border:1px solid #1e1e1e;border-radius:14px;padding:14px;margin-bottom:14px;}
.add-row{display:flex;gap:8px;margin-bottom:10px;}
.amt-wrap{position:relative;flex:1.3;}
.rupee{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:#666;font-size:17px;font-weight:600;}
input[type=number]{background:#1a1a1a;border:1px solid #2a2a2a;border-radius:10px;color:#f0f0f0;font-size:21px;font-weight:700;padding:11px 11px 11px 30px;width:100%;-webkit-appearance:none;appearance:none;outline:none;}
input[type=number]:focus{border-color:#444;}
input[type=number]::placeholder{color:#2a2a2a;}
select{background:#1a1a1a;border:1px solid #2a2a2a;border-radius:10px;color:#f0f0f0;font-size:14px;padding:11px;flex:1;outline:none;-webkit-appearance:none;appearance:none;}
input[type=text]{background:#1a1a1a;border:1px solid #2a2a2a;border-radius:10px;color:#f0f0f0;font-size:14px;padding:11px;width:100%;outline:none;}
input[type=text]::placeholder{color:#2a2a2a;}
input[type=text]:focus{border-color:#444;}
input[type=date]{background:#1a1a1a;border:1px solid #2a2a2a;border-radius:10px;color:#f0f0f0;font-size:14px;padding:11px;outline:none;color-scheme:dark;min-width:0;}
.btn-add{background:#f0f0f0;color:#000;border:none;border-radius:10px;font-size:16px;font-weight:700;padding:13px;width:100%;cursor:pointer;margin-top:2px;}
.btn-add:active{background:#ccc;transform:scale(0.98);}
.list-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.list-hdr h2{font-size:12px;font-weight:600;color:#555;text-transform:uppercase;letter-spacing:1px;}
.today-total{font-size:14px;font-weight:700;color:#f0f0f0;}
.exp-item{background:#111;border:1px solid #1e1e1e;border-radius:11px;padding:12px 14px;display:flex;align-items:center;gap:10px;margin-bottom:7px;}
.exp-icon{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
.exp-info{flex:1;min-width:0;}
.exp-cat{font-size:12px;color:#666;}
.exp-note{font-size:12px;color:#444;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.exp-right{text-align:right;flex-shrink:0;}
.exp-amt{font-size:17px;font-weight:700;color:#f0f0f0;}
.exp-time{font-size:11px;color:#444;margin-top:1px;}
.btn-del{background:none;border:none;color:#333;font-size:16px;cursor:pointer;padding:6px;margin:-6px -2px -6px 0;line-height:1;}
.btn-del:active{color:#ef4444;}
.empty{text-align:center;padding:32px 16px;color:#2a2a2a;font-size:14px;line-height:1.6;}
.budget-section{background:#111;border:1px solid #1e1e1e;border-radius:14px;padding:14px;margin-bottom:14px;}
.budget-section-title{font-size:11px;font-weight:600;color:#555;text-transform:uppercase;letter-spacing:.8px;margin-bottom:12px;}
.totals-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;}
.total-box{background:#161616;border-radius:9px;padding:11px;}
.total-box-lbl{font-size:11px;color:#555;margin-bottom:3px;}
.total-box-val{font-size:17px;font-weight:700;color:#f0f0f0;}
.bar-row{display:flex;align-items:center;gap:8px;margin-bottom:9px;}
.bar-row:last-child{margin-bottom:0;}
.bar-lbl{font-size:12px;color:#888;width:95px;flex-shrink:0;}
.bar-track{flex:1;background:#1a1a1a;border-radius:3px;height:6px;overflow:hidden;}
.bar-fill{height:100%;border-radius:3px;}
.bar-amt{font-size:12px;color:#555;width:64px;text-align:right;flex-shrink:0;}
.brow{display:flex;align-items:center;padding:8px 0;border-bottom:1px solid #161616;}
.brow:last-child{border-bottom:none;}
.brow-icon{width:30px;height:30px;border-radius:7px;background:#161616;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;margin-right:9px;}
.brow-name{flex:1;font-size:13px;color:#f0f0f0;}
.btag{display:inline-block;font-size:10px;padding:2px 5px;border-radius:3px;margin-left:5px;font-weight:600;}
.btag-fixed{background:#3f1212;color:#f87171;}
.btag-sip{background:#14301a;color:#4ade80;}
.btag-sub{background:#2e1f00;color:#fbbf24;}
.brow-amt{font-size:13px;font-weight:600;color:#f0f0f0;flex-shrink:0;}
.brow-edit{background:none;border:none;color:#333;font-size:14px;cursor:pointer;padding:4px 5px;border-radius:5px;margin-left:3px;line-height:1;}
.brow-edit:active{color:#f0f0f0;}
.inline-edit{display:flex;align-items:center;gap:5px;}
.inline-edit input{font-size:13px;padding:4px 8px;border-radius:6px;border:1px solid #3b82f6;background:#1a1a1a;color:#f0f0f0;outline:none;width:84px;text-align:right;}
.save-btn{font-size:11px;padding:4px 10px;border-radius:6px;border:1px solid #3b82f6;background:#1e3a5f;color:#93c5fd;cursor:pointer;}
.var-add{display:flex;gap:7px;margin-top:11px;}
.var-add input{flex:1;font-size:13px;padding:8px 10px;border-radius:8px;border:1px solid #2a2a2a;background:#1a1a1a;color:#f0f0f0;outline:none;}
.var-add input:focus{border-color:#3b82f6;}
.var-add input::placeholder{color:#2a2a2a;}
.var-add button{font-size:12px;padding:8px 13px;border-radius:8px;border:1px solid #2a2a2a;background:#1a1a1a;color:#888;cursor:pointer;white-space:nowrap;}
.var-add button:active{color:#f0f0f0;}
.berr{font-size:11px;color:#f87171;margin-top:5px;}
.all-date-group{margin-bottom:14px;}
.all-date-hdr{display:flex;justify-content:space-between;margin-bottom:7px;}
.all-date-lbl{font-size:12px;font-weight:600;color:#444;text-transform:uppercase;letter-spacing:.6px;}
.all-date-sum{font-size:12px;color:#444;}
.footer{display:flex;gap:8px;padding:12px 18px;background:#0a0a0a;border-top:1px solid #141414;position:sticky;bottom:0;}
.fbtn{background:#111;border:1px solid #1e1e1e;border-radius:9px;color:#666;font-size:12px;padding:9px 0;cursor:pointer;flex:1;text-align:center;}
.fbtn:active{color:#f0f0f0;background:#1a1a1a;}
</style>
</head>
<body>
<div class="wrap">
  <div class="hdr">
    <div>
      <h1>Expenses</h1>
      <div class="hdr-date" id="hdr-date"></div>
    </div>
    <div class="hdr-right">
      <div class="hdr-surplus" id="hdr-surplus">₹0</div>
      <div class="hdr-surplus-lbl">month surplus</div>
    </div>
  </div>

  <div class="tabs">
    <div class="tab active" onclick="switchTab('today',this)">Today</div>
    <div class="tab" onclick="switchTab('all',this)">All</div>
    <div class="tab" onclick="switchTab('budget',this)">Budget</div>
  </div>

  <div id="tab-today">
    <div class="add-card">
      <div class="add-row">
        <div class="amt-wrap">
          <span class="rupee">₹</span>
          <input type="number" id="inp-amount" placeholder="0" min="0" inputmode="decimal">
        </div>
        <select id="inp-cat">
          <option value="Food">🍽 Food</option>
          <option value="Transport">🛵 Transport</option>
          <option value="Shopping">🛍 Shopping</option>
          <option value="Entertainment">🎬 Entertainment</option>
          <option value="Utilities">💡 Utilities</option>
          <option value="Health">💊 Health</option>
          <option value="Other">📌 Other</option>
        </select>
      </div>
      <div class="add-row" style="margin-bottom:10px;">
        <input type="text" id="inp-note" placeholder="Note (optional)" style="flex:2;">
        <input type="date" id="inp-date" style="flex:1;">
      </div>
      <button class="btn-add" onclick="addExpense()">+ Add</button>
    </div>

    <div class="list-hdr">
      <h2>Today</h2>
      <span class="today-total" id="today-total">₹0</span>
    </div>
    <div id="today-list"></div>
  </div>

  <div id="tab-all" style="display:none;">
    <div class="list-hdr"><h2>All entries</h2></div>
    <div id="all-list"></div>
  </div>

  <div id="tab-budget" style="display:none;">
    <div class="budget-section">
      <div class="budget-section-title">Overview</div>
      <div class="totals-grid">
        <div class="total-box"><div class="total-box-lbl">Income</div><div class="total-box-val" id="ov-inc">₹0</div></div>
        <div class="total-box"><div class="total-box-lbl">Total outflow</div><div class="total-box-val" id="ov-out">₹0</div></div>
        <div class="total-box"><div class="total-box-lbl">Fixed + EMIs</div><div class="total-box-val" id="ov-fix">₹0</div></div>
        <div class="total-box"><div class="total-box-lbl">SIPs</div><div class="total-box-val" id="ov-sip">₹0</div></div>
      </div>
      <div id="overview-bars"></div>
    </div>

    <div class="budget-section">
      <div class="budget-section-title">Fixed outflows</div>
      <div id="fixed-list"></div>
    </div>

    <div class="budget-section">
      <div class="budget-section-title">Variable / food / lifestyle</div>
      <div id="variable-list"></div>
      <div class="var-add">
        <input id="nv-name" placeholder="Item">
        <input id="nv-amt" type="number" inputmode="decimal" placeholder="₹" style="flex:none;width:75px;">
        <button onclick="addBudgetItem('variable')">Add</button>
      </div>
      <div id="nv-err" class="berr" style="display:none;"></div>
    </div>

    <div class="budget-section">
      <div class="budget-section-title">Income</div>
      <div id="income-list"></div>
      <div class="var-add">
        <input id="ni-name" placeholder="Source">
        <input id="ni-amt" type="number" inputmode="decimal" placeholder="₹" style="flex:none;width:75px;">
        <button onclick="addBudgetItem('income')">Add</button>
      </div>
      <div id="ni-err" class="berr" style="display:none;"></div>
    </div>
  </div>
</div>

<div class="footer">
  <button class="fbtn" onclick="exportCSV()">⬇ CSV</button>
  <button class="fbtn" onclick="addCat()">+ Category</button>
  <button class="fbtn" onclick="clearAll()">🗑 Clear</button>
</div>

<script>
const EXP_KEY='gopi_exp_v2';
const BUD_KEY='gopi_budget_v2';

const CAT_COLORS={Food:'#f97316',Transport:'#3b82f6',Shopping:'#a855f7',Entertainment:'#ec4899',Utilities:'#eab308',Health:'#22c55e',Other:'#6b7280'};
const CAT_ICONS={Food:'🍽',Transport:'🛵',Shopping:'🛍',Entertainment:'🎬',Utilities:'💡',Health:'💊',Other:'📌'};

const BUD_DEFAULTS={
  income:[{id:1,name:'Salary',amt:110464}],
  fixed:[
    {id:2,name:'LAP EMI',amt:43731,tag:'fixed'},
    {id:3,name:'Rent',amt:10500,tag:'fixed'},
    {id:4,name:'Term Insurance',amt:6674,tag:'fixed'},
    {id:5,name:'Mortgage Insurance',amt:1470,tag:'fixed'},
    {id:6,name:'LAP Life Insurance',amt:630,tag:'fixed'},
    {id:7,name:'HDFC (savings)',amt:5000,tag:'fixed'},
    {id:8,name:'ICICI (contingency)',amt:3000,tag:'fixed'},
    {id:9,name:'SBI Large & Midcap',amt:1630,tag:'sip'},
    {id:10,name:'SBI PSU Fund',amt:3510,tag:'sip'},
    {id:11,name:'DSP Natural Resources',amt:2000,tag:'sip'},
    {id:12,name:'HDFC Small Cap',amt:2000,tag:'sip'},
    {id:13,name:'Nippon Large Cap',amt:500,tag:'sip'},
    {id:14,name:'UTI Nifty 50',amt:2500,tag:'sip'},
    {id:15,name:'Netflix',amt:199,tag:'sub'},
    {id:16,name:'Spotify',amt:119,tag:'sub'},
    {id:17,name:'Marvel',amt:790,tag:'sub'},
    {id:18,name:'iCloud+',amt:75,tag:'sub'},
    {id:19,name:'Claude',amt:2000,tag:'sub'}
  ],
  variable:[
    {id:20,name:'Breakfast',amt:1800},
    {id:21,name:'Lunch',amt:7500},
    {id:22,name:'Eggs',amt:900},
    {id:23,name:'Banana',amt:300},
    {id:24,name:'Diet Coke',amt:1200},
    {id:25,name:'Dry Fruits',amt:2500},
    {id:26,name:'Snacks',amt:1500},
    {id:27,name:'Petrol',amt:2000},
    {id:28,name:'Train Tickets',amt:2000},
    {id:29,name:'Additional Travel',amt:3000},
    {id:30,name:'Head Massage',amt:1000},
    {id:31,name:'Hair Cut',amt:400}
  ]
};

let expenses=JSON.parse(localStorage.getItem(EXP_KEY)||'[]');
let budget=JSON.parse(localStorage.getItem(BUD_KEY)||'null')||JSON.parse(JSON.stringify(BUD_DEFAULTS));
let customCats=JSON.parse(localStorage.getItem('gopi_cats')||'[]');
let editingId=null;

function today(){return new Date().toISOString().slice(0,10);}
function fmtTime(iso){return new Date(iso).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',hour12:true});}
function fmtDate(d){return new Date(d+'T12:00:00').toLocaleDateString('en-IN',{day:'numeric',month:'short'});}
function fmt(n){return '₹'+Math.round(n).toLocaleString('en-IN');}
function saveExp(){localStorage.setItem(EXP_KEY,JSON.stringify(expenses));}
function saveBud(){localStorage.setItem(BUD_KEY,JSON.stringify(budget));}

function init(){
  document.getElementById('inp-date').value=today();
  document.getElementById('hdr-date').textContent=new Date().toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long'});
  loadCustomCats();
  render();
}

function loadCustomCats(){
  const sel=document.getElementById('inp-cat');
  customCats.forEach(c=>{
    if(!CAT_COLORS[c]){CAT_COLORS[c]='#888';CAT_ICONS[c]='📌';}
    if(!sel.querySelector(`option[value="${c}"]`)){
      const o=document.createElement('option');o.value=c;o.textContent='📌 '+c;sel.appendChild(o);
    }
  });
}

function addExpense(){
  const amt=parseFloat(document.getElementById('inp-amount').value);
  if(!amt||amt<=0){document.getElementById('inp-amount').focus();return;}
  const cat=document.getElementById('inp-cat').value;
  const note=document.getElementById('inp-note').value.trim();
  const date=document.getElementById('inp-date').value||today();
  expenses.unshift({id:Date.now(),amount:amt,category:cat,note,date,time:new Date().toISOString()});
  saveExp();
  document.getElementById('inp-amount').value='';
  document.getElementById('inp-note').value='';
  document.getElementById('inp-date').value=today();
  document.getElementById('inp-amount').focus();
  render();
}

function delExpense(id){
  expenses=expenses.filter(e=>e.id!==id);saveExp();render();
}

function render(){
  renderSurplus();
  renderToday();
  renderAll();
  renderBudget();
}

function renderSurplus(){
  const t=budTotals();
  const el=document.getElementById('hdr-surplus');
  el.textContent=fmt(t.surplus);
  el.className='hdr-surplus '+(t.surplus>=0?'green':'red');
}

function renderToday(){
  const tod=expenses.filter(e=>e.date===today());
  const total=tod.reduce((s,e)=>s+e.amount,0);
  document.getElementById('today-total').textContent=fmt(total);
  document.getElementById('today-list').innerHTML=tod.length
    ?tod.map(expHTML).join('')
    :'<div class="empty">No entries yet today.<br>Add your first one above.</div>';
}

function expHTML(e){
  const col=CAT_COLORS[e.category]||'#888';
  const icon=CAT_ICONS[e.category]||'📌';
  const timeStr=e.date===today()?fmtTime(e.time):fmtDate(e.date);
  return`<div class="exp-item">
    <div class="exp-icon" style="background:${col}22;">${icon}</div>
    <div class="exp-info">
      <div class="exp-cat">${e.category}</div>
      ${e.note?`<div class="exp-note">${e.note}</div>`:''}
    </div>
    <div class="exp-right">
      <div class="exp-amt">${fmt(e.amount)}</div>
      <div class="exp-time">${timeStr}</div>
    </div>
    <button class="btn-del" onclick="delExpense(${e.id})">✕</button>
  </div>`;
}

function renderAll(){
  if(!expenses.length){document.getElementById('all-list').innerHTML='<div class="empty">No entries yet.</div>';return;}
  const byDate={};
  expenses.forEach(e=>{(byDate[e.date]=byDate[e.date]||[]).push(e);});
  document.getElementById('all-list').innerHTML=Object.keys(byDate).sort().reverse().map(d=>{
    const sum=byDate[d].reduce((s,e)=>s+e.amount,0);
    return`<div class="all-date-group">
      <div class="all-date-hdr">
        <span class="all-date-lbl">${d===today()?'Today':fmtDate(d)}</span>
        <span class="all-date-sum">${fmt(sum)}</span>
      </div>
      ${byDate[d].map(expHTML).join('')}
    </div>`;
  }).join('');
}

function budTotals(){
  const inc=budget.income.reduce((s,x)=>s+x.amt,0);
  const fix=budget.fixed.filter(x=>x.tag==='fixed').reduce((s,x)=>s+x.amt,0);
  const sip=budget.fixed.filter(x=>x.tag==='sip').reduce((s,x)=>s+x.amt,0);
  const sub=budget.fixed.filter(x=>x.tag==='sub').reduce((s,x)=>s+x.amt,0);
  const vr=budget.variable.reduce((s,x)=>s+x.amt,0);
  return{inc,fix,sip,sub,vr,out:fix+sip+sub+vr,surplus:inc-(fix+sip+sub+vr)};
}

const TICO={fixed:'🏦',sip:'📈',sub:'📱'};
const TLBL={fixed:'Fixed',sip:'SIP',sub:'Sub'};
const TCLS={fixed:'btag-fixed',sip:'btag-sip',sub:'btag-sub'};

function budRowHTML(item,list){
  const editing=editingId===item.id;
  const icon=item.tag?TICO[item.tag]||'📌':(list==='income'?'💰':'🛒');
  const canDel=(list==='variable')||(list==='income'&&budget.income.length>1);
  return`<div class="brow" id="brow-${item.id}">
    <div class="brow-icon">${icon}</div>
    <span class="brow-name">${item.name}${item.tag?`<span class="btag ${TCLS[item.tag]}">${TLBL[item.tag]}</span>`:''}</span>
    ${editing
      ?`<div class="inline-edit">
          <input id="bei-${item.id}" type="number" inputmode="decimal" value="${item.amt}" onkeydown="if(event.key==='Enter')saveBudEdit(${item.id},'${list}')">
          <button class="save-btn" onclick="saveBudEdit(${item.id},'${list}')">Save</button>
        </div>`
      :`<span class="brow-amt">${fmt(item.amt)}</span>`}
    <button class="brow-edit" onclick="startBudEdit(${item.id})">✎</button>
    ${canDel?`<button class="brow-edit" onclick="delBudItem(${item.id},'${list}')">✕</button>`:''}
  </div>`;
}

function renderBudget(){
  const t=budTotals();
  document.getElementById('ov-inc').textContent=fmt(t.inc);
  document.getElementById('ov-out').textContent=fmt(t.out);
  document.getElementById('ov-fix').textContent=fmt(t.fix);
  document.getElementById('ov-sip').textContent=fmt(t.sip);
  const cats=[
    {l:'Fixed / EMIs',v:t.fix,c:'#ef4444'},
    {l:'SIPs',v:t.sip,c:'#22c55e'},
    {l:'Subscriptions',v:t.sub,c:'#a855f7'},
    {l:'Variable',v:t.vr,c:'#f97316'}
  ];
  const mx=Math.max(...cats.map(c=>c.v),1);
  document.getElementById('overview-bars').innerHTML=cats.map(c=>`
    <div class="bar-row">
      <span class="bar-lbl">${c.l}</span>
      <div class="bar-track"><div class="bar-fill" style="width:${Math.round((c.v/mx)*100)}%;background:${c.c};"></div></div>
      <span class="bar-amt">${fmt(c.v)}</span>
    </div>`).join('');
  document.getElementById('fixed-list').innerHTML=budget.fixed.map(i=>budRowHTML(i,'fixed')).join('');
  document.getElementById('variable-list').innerHTML=budget.variable.map(i=>budRowHTML(i,'variable')).join('');
  document.getElementById('income-list').innerHTML=budget.income.map(i=>budRowHTML(i,'income')).join('');
  if(editingId){setTimeout(()=>{const el=document.getElementById('bei-'+editingId);if(el){el.focus();el.select();}},20);}
}

function startBudEdit(id){editingId=id;renderBudget();}
function saveBudEdit(id,list){
  const el=document.getElementById('bei-'+id);if(!el)return;
  const v=parseFloat(el.value);if(isNaN(v)||v<0)return;
  const item=budget[list].find(x=>x.id===id);if(item)item.amt=v;
  editingId=null;saveBud();render();
}
function delBudItem(id,list){
  if(!confirm('Remove this entry?'))return;
  budget[list]=budget[list].filter(x=>x.id!==id);saveBud();render();
}
function addBudgetItem(list){
  const pre=list==='variable'?'nv':'ni';
  const nameEl=document.getElementById(pre+'-name');
  const amtEl=document.getElementById(pre+'-amt');
  const errEl=document.getElementById(pre+'-err');
  const n=nameEl.value.trim(),a=parseFloat(amtEl.value);
  if(!n||isNaN(a)||a<=0){errEl.textContent=!n?'Enter a name.':'Enter a valid amount.';errEl.style.display='block';setTimeout(()=>errEl.style.display='none',2000);return;}
  errEl.style.display='none';
  budget[list].push({id:Date.now(),name:n,amt:a});
  nameEl.value='';amtEl.value='';saveBud();render();
}

function switchTab(tab,el){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  ['today','all','budget'].forEach(t=>{document.getElementById('tab-'+t).style.display=t===tab?'':'none';});
}

function addCat(){
  const name=prompt('New category name:');if(!name||!name.trim())return;
  const c=name.trim();if(customCats.includes(c))return;
  customCats.push(c);localStorage.setItem('gopi_cats',JSON.stringify(customCats));
  CAT_COLORS[c]='#888';CAT_ICONS[c]='📌';
  const sel=document.getElementById('inp-cat');
  const o=document.createElement('option');o.value=c;o.textContent='📌 '+c;sel.appendChild(o);sel.value=c;
}

function exportCSV(){
  const rows=[['Date','Time','Category','Amount','Note']];
  [...expenses].sort((a,b)=>a.date<b.date?-1:1).forEach(e=>{
    rows.push([e.date,fmtTime(e.time),e.category,e.amount,e.note||'']);
  });
  const csv=rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  const a=document.createElement('a');
  a.href='data:text/csv;charset=utf-8,\uFEFF'+encodeURIComponent(csv);
  a.download='expenses_'+today()+'.csv';
  document.body.appendChild(a);a.click();document.body.removeChild(a);
}

function clearAll(){
  if(confirm('Delete ALL daily expense entries? Budget data is kept.')){{expenses=[];saveExp();render();}}
}

document.getElementById('inp-amount').addEventListener('keydown',e=>{if(e.key==='Enter')addExpense();});
init();
</script>
</body>
</html>
